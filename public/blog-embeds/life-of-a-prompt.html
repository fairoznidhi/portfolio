<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life of a Prompt</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* layout idea: one vertical timeline of 13 clickable steps, colored by who does the work */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#151a22; --muted:#596273; --line:#dce0e6; --soft:#eef0f3;
  --client:#546073; --server:#0f766e; --runtime:#a3480a; --model:#6232c9;
  --special:#fdf0c9; --specialink:#6b4a00; --new:#d6f3e4; --newink:#0b5132;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1318; --surface:#171c23; --ink:#e8ebf0; --muted:#9aa4b4; --line:#2a313b; --soft:#1e252d;
    --client:#9aa7bb; --server:#2dd4bf; --runtime:#fbbf24; --model:#b69cff;
    --special:#3a3115; --specialink:#f5d98a; --new:#143626; --newink:#8fe3b5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1318; --surface:#171c23; --ink:#e8ebf0; --muted:#9aa4b4; --line:#2a313b; --soft:#1e252d;
  --client:#9aa7bb; --server:#2dd4bf; --runtime:#fbbf24; --model:#b69cff;
  --special:#3a3115; --specialink:#f5d98a; --new:#143626; --newink:#8fe3b5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 0 12px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0}
.top .lead{margin:6px 0 0;font-size:14px;line-height:1.5}
.walk{margin:0!important;flex-wrap:nowrap!important}
.step{scroll-margin-top:90px}
@media (max-height:620px){.top .lead{display:none}}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;font-weight:600;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ask b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.ask code{font-family:var(--mono);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.legend small{color:var(--muted);margin-right:2px}
.fchip{font:inherit;font-size:13px;cursor:pointer;padding:4px 11px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.fchip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.fchip:focus-visible,.sh:focus-visible,.btn:focus-visible,.pbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.walk{display:flex;gap:8px;align-items:center;margin:0 0 18px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;cursor:pointer;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.band{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;font-weight:500;display:flex;align-items:center;gap:10px}
.band:after{content:"";flex:1;height:1px;background:var(--line)}
.step{--c:var(--server);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;margin:0 0 8px;transition:opacity .15s}
.step.dim{opacity:.38}
.step.open{border-color:var(--c)}
.sh{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:11px 14px}
.num{width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--surface);font:500 13px/26px var(--mono);text-align:center}
.st{font-weight:600;font-size:16px;line-height:1.3}
.ss{color:var(--muted);font-size:14px;line-height:1.4;display:block;font-weight:400}
.own{font-size:12px;color:var(--c);border:1px solid var(--c);padding:1px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.body{padding:2px 16px 16px 54px}
.sec{margin:12px 0 0}
.sec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--c);font-weight:600}
.sec p{margin:0;max-width:68ch}
.sec ul{margin:4px 0 0;padding-left:18px}
.sec li{margin:2px 0}
pre{margin:6px 0 0;padding:10px 12px;background:var(--soft);border-radius:8px;overflow-x:auto;font:13px/1.55 var(--mono)}
.mono{font-family:var(--mono);font-size:13px}
.sp{background:var(--special);color:var(--specialink);border-radius:4px;padding:0 3px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tok{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:2px 6px;font:12px/1.35 var(--mono)}
.tok i{font-style:normal;color:var(--muted);font-size:11px}
.tok.s{background:var(--special);color:var(--specialink);border-color:transparent}
.tok.s i{color:var(--specialink);opacity:.8}
.tok.n{background:var(--new);color:var(--newink);border-color:transparent}
.tok.n i{color:var(--newink);opacity:.85}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:6px}
.flow .box{background:var(--soft);border-radius:8px;padding:8px 10px;font:13px/1.5 var(--mono);overflow-wrap:anywhere}
.flow .arr{color:var(--c);font-size:20px}
@media (max-width:600px){.flow{grid-template-columns:1fr}.flow .arr{transform:rotate(90deg);justify-self:center}.body{padding-left:16px}.sh{grid-template-columns:30px 1fr}.own{grid-column:2;justify-self:start}}
.row{display:grid;grid-template-columns:minmax(96px,150px) 1fr 64px;gap:8px;align-items:center;margin:4px 0;font:13px/1.3 var(--mono)}
.track{background:var(--soft);border-radius:4px;height:12px;overflow:hidden}
.bar{height:100%;background:var(--c);border-radius:4px;transition:width .2s}
.row.pick .bar{outline:2px solid var(--ink)}
.row .v{text-align:right;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;font-weight:400;vertical-align:top}
.tbl th{color:var(--muted);font-size:12px}
.tbl td.m{font-family:var(--mono)}
.tbl tr.cur td{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.ctl input[type=range]{accent-color:var(--c);width:180px;max-width:100%}
.res{margin-top:8px;font-size:14px}
.res b{font-family:var(--mono);font-weight:500}
.stop{display:inline-block;background:var(--c);color:var(--surface);border-radius:6px;padding:0 8px;font-size:13px}
.grp{--c:var(--server);position:relative;border:2px dotted var(--c);border-radius:14px;padding:34px 12px 4px;margin:0 0 14px}
.gl{position:absolute;top:9px;left:16px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--c)}
.gl small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
.loop{border:2px dashed var(--muted);border-radius:18px;margin:0 0 14px;padding:12px 10px 0}
.loop .grp{margin-bottom:10px}
.grp .grp{margin-top:6px}
.grp .grp .grp .step{margin-bottom:8px}
.grp>.step:last-child{margin-bottom:10px}
.loophead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px;font-size:14px}
.loophead strong{font-weight:600}
.pbtn{font:inherit;font-size:13px;cursor:pointer;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.loopback{font-size:13px;color:var(--runtime);margin:2px 0 10px 4px}
.q{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.q span{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:3px 10px;font:13px var(--mono)}
.q span.me{background:var(--c);color:var(--surface);border-color:var(--c)}
.ok{color:var(--server)}
.v1{margin-top:6px;display:flex;flex-direction:column;align-items:stretch}
.stg{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin:0 0 6px}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.win{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.wt{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.wt i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.wt span{margin-left:6px}
.wb{padding:8px 10px;margin:0;font-size:13px;flex:1}
.win pre.wb{background:#10151c;color:#d8f3e6;border-radius:0;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.bub{background:var(--c);color:var(--surface);border-radius:12px 12px 2px 12px;padding:6px 10px;margin:0 0 8px auto;max-width:92%;width:fit-content}
.inp{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted);font-size:12px}
.inp b{font-weight:500;color:var(--ink);background:var(--soft);border-radius:4px;padding:0 6px}
.vc{display:flex;flex-direction:column;align-items:center;margin:10px 0;color:var(--c)}
.vc:before{content:"";width:4px;height:26px;background:var(--c);border-radius:2px}
.vc span{font-size:13px;padding:4px 16px;border-radius:999px;background:var(--c);color:var(--surface);font-weight:600}
.vc:after{content:"";width:0;height:0;border:13px solid transparent;border-top:16px solid var(--c);border-bottom:0;margin-top:0}
.dt{background:#1d2026;color:#d5d8de;border-radius:8px;overflow:hidden;font:12px/1.65 var(--mono);border:1px solid #343a43}
.dtt{display:flex;gap:16px;padding:6px 12px 0;background:#262a31;border-bottom:1px solid #343a43;color:#9aa0aa}
.dtt span{padding:2px 0 6px;border-bottom:2px solid transparent}
.dtt .on{color:#fff;border-bottom-color:#5aa8ff}
.dts{padding:6px 12px 8px;border-bottom:1px solid #2b3037}
.dts:last-child{border-bottom:0}
.dts h5{margin:0 0 2px;font:600 12px var(--mono);color:#e8eaee}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px}
.kv b{font-weight:600;color:#aeb4be}
.kv span{overflow-wrap:anywhere}
.dt .cm{color:#7d8590;font-style:italic}
.dt .jk{color:#7ec7ff}.dt .js{color:#f0a674}.dt .jn{color:#b5e6a0}.dt .jb{color:#c9a7ff}
.dt pre{margin:0;background:none;padding:0;font:12px/1.65 var(--mono);color:#d5d8de;white-space:pre-wrap;overflow-wrap:anywhere}
.srv{border:1px dashed var(--server);color:var(--server);border-radius:8px;padding:6px 12px;text-align:center;font-size:13px;font-weight:500}
@media (max-width:600px){.kv{grid-template-columns:1fr;gap:0}}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.ov h3{margin:0 0 2px;font-size:16px;font-weight:600}
.ov .sub{margin:0 0 10px;color:var(--muted);font-size:13px}
.dgw{overflow-x:auto}
.dg{display:block;width:100%;min-width:560px;height:auto}
.dg .ar{fill:none;stroke:var(--muted);stroke-width:2}
.dg .mk{fill:var(--muted)}
.dg .bx{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}
.dg .bl{fill:var(--c);font:600 12px var(--sans);letter-spacing:.08em;text-anchor:end}
.dg .lp{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 5}
.dg .lpl{fill:var(--muted);font:600 11px var(--sans);letter-spacing:.06em;text-anchor:end}
.dg .nd{cursor:pointer;outline:none}
.dg .nd rect{fill:color-mix(in srgb,var(--c) 12%,var(--surface));stroke:var(--c);stroke-width:1.5}
.dg .nd circle{fill:var(--c)}
.dg .nn{fill:var(--surface);font:600 12px var(--mono);text-anchor:middle}
.dg .nl{fill:var(--ink);font:500 12.5px var(--sans)}
.dg .nd:hover rect,.dg .nd:focus-visible rect{stroke-width:3.5}
.dg .al{fill:var(--muted);font:12px var(--sans)}
.chk{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cr{display:grid;grid-template-columns:30px minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.cr:first-child{border-top:0}
.cr .ic{width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--surface);font:600 12px/22px var(--mono);text-align:center}
.cr b{font-weight:600;font-size:14px;display:block;line-height:1.3}
.cr small{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.cr code{font:12px/1.4 var(--mono);overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.pill.skip{--c:var(--muted)}
.dt .st2{color:#ff8a80;font-weight:600}
.errs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.errs span{font:12px var(--mono);border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:2px 8px}
@media (max-width:600px){.cr{grid-template-columns:30px 1fr;gap:4px 10px}.cr .pill{justify-self:start;grid-column:2}}
.qcol{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 12px;font-size:14px}
.qi .p{font:12px var(--mono);color:var(--muted)}
.qi.me{background:var(--c);color:var(--surface);border-color:var(--c);font-weight:600}
.qi.me .p{color:var(--surface)}
.qi.gone{border-style:dashed;background:none;color:var(--muted)}
.qend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:2px 2px 0}
.srv.go{background:var(--c);color:var(--surface);border-style:solid}
.srv.wait{color:var(--muted);border-color:var(--line)}
.fl{display:flex;flex-direction:column}
.fband{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:6px 0 8px}
.fn{display:grid;grid-template-columns:26px 1fr;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.fn .num{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.fn h4{margin:0 0 2px;font-size:14px;font-weight:600}
.fn p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.4}
.fa{text-align:center;color:var(--muted);line-height:1;font-size:16px;margin:3px 0}
.calc{margin-top:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;line-height:1.55;color:var(--ink);background:var(--surface)}
.calc b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
.v1{gap:10px}
.sh{cursor:default}
.more{margin-top:10px}
.more summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:revert}
.more .kw{margin-top:6px}
.step.open{box-shadow:0 0 0 2px var(--c)}
.pl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.lay{max-width:680px;display:block}
.v1 .stg{margin:0 0 -4px}
.v1 .ctl{margin-top:0}
.v1 .wb{padding:6px 9px}
.v1 .dts{padding:4px 11px 6px}
.v1 .dtt{padding-top:4px}
.v1 .dtt span{padding-bottom:4px}
.v1 .cr{padding:5px 12px}
.v1 .qi{padding:5px 12px}
.v1 .srv{padding:5px 12px}
.v1 .qcol{gap:4px}
.body{padding-bottom:12px}
.sec{margin-top:10px}
.qrow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.ql{align-self:center;font-size:12px;color:var(--muted)}
.qc{flex:1 1 90px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 10px;font-size:13px;text-align:center;line-height:1.3}
.qc small{display:block;font:11px var(--mono);color:var(--muted)}
.qc.me{background:var(--c);color:var(--surface);border-color:var(--c);font-weight:600}
.qc.me small{color:var(--surface)}
.cr{grid-template-columns:30px 1fr auto!important}
.cr small{display:inline!important}
.cr b{display:inline!important}
.v1 .srcs{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.v1 .win pre.wb{padding:5px 9px}
.v1 pre{font-size:12px}
.sh{padding:9px 14px}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:8px;padding:6px 8px 6px 12px;font-size:14px;color:var(--muted)}
.qbar b{font-weight:600;color:var(--ink);margin-right:6px}
.qbar.go{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.qbar.go b{color:var(--c)}
.qbt{display:flex;gap:6px}
.qbt .btn{padding:4px 12px;font-size:13px}
.qbt .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface)}
.qbt .btn:disabled{opacity:.45;cursor:default}
.kw{list-style:none;margin:10px 0 0;padding:0}
.kw li{margin:2px 0;font-size:14px;line-height:1.5;padding-left:108px;text-indent:-108px}
.kw b{text-indent:0;vertical-align:top;display:inline-block;min-width:108px;color:var(--c);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.pill.ok{--c:var(--server)}
.pill.fail{--c:#d1483f}
.pill.idle,.pill.skip{--c:var(--muted)}
.qbar.bad{border:1px solid #d1483f;background:color-mix(in srgb,#d1483f 9%,var(--surface))}
.qbar.bad b{color:#d1483f}
.seg{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--soft);width:fit-content;max-width:100%;flex-wrap:wrap}
.seg .sl{font-size:12px;color:var(--muted);padding:0 8px}
.sb{font:inherit;font-size:13px;cursor:pointer;border:0;background:transparent;color:var(--ink);border-radius:6px;padding:3px 12px}
.sb[aria-pressed="true"]{background:var(--c);color:var(--surface);font-weight:600}
.sb:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tp{margin:0;background:var(--soft);padding:8px 12px;border-radius:8px;font:12.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.kvg{display:flex;flex-wrap:wrap;gap:3px}
.kc{width:14px;height:14px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.kc.on{background:var(--c);border-color:var(--c)}
.v1 .row{margin:2px 0}
.v1 .qst input[type=range]{accent-color:var(--c);width:130px;vertical-align:middle}
.v1 .qst .seg{margin-right:6px}
.kr{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;margin:2px 0}
.kl{font-size:13px;font-weight:600}
.kt{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:600px){.kr{grid-template-columns:54px 1fr}.kt{grid-column:2}}

var STEPS=[
{o:"client",t:"You send the prompt",s:"Your app packs the text into a request",b:function(){return step1Visual()+'<details class="more"><summary>What and why</summary><ul class="kw"><li><b>What</b> text → HTTP request</li><li><b>Where</b> localhost:11434 (Ollama) · company API (cloud)</li><li><b>Why</b> one fixed format · any app talks to any server</li></ul></details>'}},

{o:"model",t:"Embedding",s:"Each token ID becomes a vector of numbers",g:"loop",b:function(){

  var out='<table class="tbl"><tr><th>#</th><th>Token</th><th>ID</th><th>Vector copied from its row</th></tr>'+Q.map(function(r,i){return '<tr><td class="m">'+(i+1)+'</td><td>'+r[0]+'</td><td class="m">'+r[1]+'</td><td class="m">'+vecTxt(EV[r[0]])+'</td></tr>'}).join('')+'<tr><td class="m">…</td><td colspan="3">19 more for the template tokens (&lt;|im_start|&gt;, system, …)</td></tr></table>';
  var tr='<details class="fn" style="display:block;margin-top:12px"><summary style="cursor:pointer;font-weight:600;font-size:14px">How did the table get its numbers? (training, done once, before release)</summary><p style="margin:8px 0">Every row starts random. The model guesses the next token on real text, and each miss nudges the rows involved. After billions of nudges, tokens used in similar sentences end up with close rows.</p><div class="qbar wait" style="margin:0 0 8px"><span class="qst"><label for="tr">Training progress <b id="trv">'+S.embp+'%</b></label> <input id="tr" type="range" min="0" max="100" step="5" value="'+S.embp+'"></span><span class="qbt"><button class="btn primary" id="trplay">▶ Train</button></span></div><div id="trt">'+trainHTML()+'</div></details>';
  var h=passSeg()+'<div class="fl">'+

{o:"model",t:"Transformer layers",s:"Tokens read each other to get context",g:"loop",b:function(){

    R.forEach(function(r){var m=r[2].map(function(x){return x*r[1]});m.forEach(function(x,k){sm[k]+=x});rows+='<tr><td>'+r[0]+'</td><td class="m">× '+r[1].toFixed(2)+'</td><td class="m">'+vt(r[2])+'</td><td class="m">'+vt(m.map(function(x){return Math.round(x*100)/100}))+'</td></tr>'});

    return '<svg viewBox="0 0 680 96" width="100%" role="img" aria-label="The new token compares its query with all saved keys">'+o+'</svg>'}
  function mlpSvg(){

    for(i=0;i<4;i++)for(j=0;j<8;j++)o+='<line x1="'+X[0]+'" y1="'+I[i]+'" x2="'+X[1]+'" y2="'+H[j]+'" stroke="var(--line)" stroke-width="0.6"/><line x1="'+X[1]+'" y1="'+H[j]+'" x2="'+X[2]+'" y2="'+I[i]+'" stroke="var(--line)" stroke-width="0.6"/>';
